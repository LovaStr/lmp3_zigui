name: Build and release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Fetch SDL3 MinGW development package
        run: |
          mkdir -p sdl3
          gh release download --repo libsdl-org/SDL --pattern 'SDL3-devel-*-mingw.tar.gz' --dir sdl3
          tar -xzf sdl3/SDL3-devel-*-mingw.tar.gz -C sdl3
          prefix=$(find sdl3 -type d -name x86_64-w64-mingw32 | head -n 1)
          echo "SDL3_PREFIX=$GITHUB_WORKSPACE/$prefix" >> "$GITHUB_ENV"

      - name: Unit tests
        run: zig build test

      - name: Build (Windows x86_64, ReleaseFast)
        run: >
          zig build -Doptimize=ReleaseFast -Dtarget=x86_64-windows-gnu
          -Dsdl3-prefix="$SDL3_PREFIX"
          -Dsdl3-dll="$SDL3_PREFIX/bin/SDL3.dll"

      - name: Package
        run: |
          short=$(git rev-parse --short HEAD)
          echo "VERSION=build-${{ github.run_number }}-$short" >> "$GITHUB_ENV"
          (cd zig-out/bin && zip -9 "$GITHUB_WORKSPACE/lmp3-windows-x64.zip" lmp3.exe SDL3.dll)

      - uses: actions/upload-artifact@v4
        if: github.event_name == 'pull_request'
        with:
          name: lmp3-windows-x64
          path: lmp3-windows-x64.zip

      - name: Create release
        if: github.event_name == 'push'
        run: >
          gh release create "$VERSION" lmp3-windows-x64.zip
          --target "$GITHUB_SHA"
          --title "lmp3 $VERSION"
          --generate-notes
